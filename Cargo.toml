[package]
name = "RetroBot"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/RetroRealm/RetroBot"

[workspace]
members = ["playmatch_client", "."]

[dependencies]
# basic rust dependencies
tokio = { version = "^1.52", features = ["macros", "rt-multi-thread", "time"] }
dotenvy = "^0.15"
log = "^0.4"
anyhow = "^1.0"
tracing = "^0.1"
tracing-subscriber = "^0.3"
serde = { version = "^1.0", features = ["derive"] }
chrono = "^0.4"
reqwest = { version = "^0.13", features = ["rustls", "json", "stream"], default-features = false }
lazy_static = "^1.5"
futures = "^0.3"
uuid = { version = "^1.23", features = ["serde", "v4"] }

# discord api (Components V2 only exists on unreleased next branches)
serenity = { git = "https://github.com/serenity-rs/serenity", branch = "next", default-features = false, features = ["gateway", "rustls_backend", "model", "framework", "cache", "builder", "chrono"] }
poise = { git = "https://github.com/serenity-rs/poise", branch = "serenity-next", features = ["chrono", "cache"] }

# playmatch
playmatch_client = { path = "playmatch_client" }
governor = "^0.10"
redis = { version = "^1.0", features = ["tokio-comp", "connection-manager"] }

# commands
unicode-width = "^0.2"

[build-dependencies]
built = { version = "^0.8", features = ["chrono", "semver", "git2"] }

[dev-dependencies]
wiremock = "^0.6"
